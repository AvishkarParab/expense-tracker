<section class="page-shell">
  <app-form-errors [serverError]="errorMessage()" />

  <div class="surface-card">
    <h1>Create account</h1>

    <form [formRoot]="registerForm">
      <app-input-text
        [id]="'email'"
        [name]="'email'"
        [label]="'Email'"
        [type]="'email'"
        [iconClass]="'bi bi-person'"
        [autocomplete]="'email'"
        [placeholder]="'you@example.com'"
        [field]="registerForm.email"
      />

      <app-input-text
        [id]="'password'"
        [name]="'password'"
        [label]="'Password'"
        [type]="'password'"
        [iconClass]="'bi bi-lock'"
        [autocomplete]="'new-password'"
        [placeholder]="'At least 8 characters'"
        [field]="registerForm.password"
      />

      <button class="btn btn-primary button-shine-hover" type="submit" [disabled]="registerForm().invalid() || isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          Creating account...
        } @else {
          Register
        }
      </button>
    </form>

    <p class="auth-toggle">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

    @if (successMessage(); as message) {
      <p class="success-message">{{ message }}</p>
    }
  </div>
</section>
