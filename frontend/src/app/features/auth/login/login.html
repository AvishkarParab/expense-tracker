<section class="login-page">
  <div class="login-intro">
    <span class="eyebrow">Welcome back</span>
    <h1>Your finances,<br /><em>in focus.</em></h1>
    <p>See where your money goes, build better habits, and make every decision count.</p>
    <div class="intro-accent" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="login-card">
    <div class="card-heading">
      <h2>Sign in</h2>
      <p>Enter your details to access your dashboard.</p>
    </div>

    <form (ngSubmit)="$event.preventDefault()" #loginForm="ngForm">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
        [(ngModel)]="credentials.email"
      />

      <div class="password-label">
        <label for="password">Password</label>
        <a href="#" (click)="$event.preventDefault()">Forgot password?</a>
      </div>
      <div class="password-input">
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
          [(ngModel)]="credentials.password"
        />
        <button type="button" class="password-toggle" (click)="togglePassword()">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>

      <button class="submit-button" type="submit" [disabled]="loginForm.invalid">Sign in</button>
    </form>

    <p class="signup-prompt">New to ExpenseTrack? <a routerLink="/register">Create an account</a></p>
  </div>
</section>
