<section class="page-shell">
  <app-form-errors [serverError]="errorMessage()" />

  <div class="surface-card my-4">
    <form [formRoot]="loginForm">
      <app-input-text
        [id]="'username'"
        [name]="'username'"
        [label]="'Email'"
        [type]="'email'"
        [autocomplete]="'email'"
        [placeholder]="'you@example.com'"
        [field]="loginForm.username"
      />

      <app-input-text
        [id]="'password'"
        [name]="'password'"
        [label]="'Password'"
        [type]="'password'"
        [autocomplete]="'current-password'"
        [placeholder]="'Enter your password'"
        [field]="loginForm.password"
      />

      <button
        class="btn btn-primary button-shine-hover"
        type="submit"
        [disabled]="loginForm().invalid() || isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          Signing in...
        } @else {
          Login
        }
      </button>
    </form>

    <p class="auth-toggle">
      Need an account?
      <a routerLink="/register">Create one</a>
    </p>

  </div>
</section>
