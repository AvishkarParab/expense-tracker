<header class="app-header sticky-top">
  <div
    class="container-fluid d-flex align-items-center justify-content-between gap-3 px-3 px-lg-5 py-2"
  >
    <!-- Brand -->
    <a
      class="app-brand d-inline-flex align-items-center gap-2 text-decoration-none"
      routerLink="/login"
    >
      <img class="app-brand-mark" src="expense-tracker-logo.svg" alt="Expense Tracker Logo" />
      <span class="app-brand-text">Expense Tracker</span>
    </a>

    <!-- Theme Toggle -->
    <button
      type="button"
      class="theme-button btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Use light theme' : 'Use dark theme'"
      [attr.title]="themeService.theme() === 'dark' ? 'Use light theme' : 'Use dark theme'"
    >
      <i
        class="theme-icon bi"
        [class.bi-sun]="themeService.theme() === 'dark'"
        [class.bi-moon-stars]="themeService.theme() !== 'dark'"
        aria-hidden="true"
      ></i>
    </button>
  </div>
</header>
