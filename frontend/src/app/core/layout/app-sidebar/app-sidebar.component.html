<aside class="app-sidebar d-flex min-vh-100 flex-column gap-4 p-3">
  <div class="app-sidebar-brand d-flex align-items-center gap-3">
    <img class="brand-mark" src="expense-tracker-logo.svg" alt="" />
    @if (!collapsed()) {
      <span>Expense Tracker</span>
    }
  </div>

  <button
    type="button"
    class="sidebar-toggle btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2"
    (click)="collapseSidebar.emit()"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.aria-expanded]="!collapsed()"
  >
    @if (collapsed()) {
      <span aria-hidden="true">→</span>
    } @else {
      <span aria-hidden="true">←</span>
      <span>Collapse</span>
    }
  </button>

  <nav class="app-navigation nav flex-column gap-1" aria-label="Main navigation">
    <a
      class="app-navigation-link nav-link d-flex align-items-center gap-3"
      routerLink="/dashboard"
      routerLinkActive="active"
    >
      <i class="navigation-icon bi bi-speedometer2" aria-hidden="true"></i>
      @if (!collapsed()) {
        <span>Overview</span>
      }
    </a>
    <a
      class="app-navigation-link nav-link d-flex align-items-center gap-3"
      routerLink="/expenses"
      routerLinkActive="active"
    >
      <i class="navigation-icon bi bi-wallet2" aria-hidden="true"></i>
      @if (!collapsed()) {
        <span>Expenses</span>
      }
    </a>
  </nav>

  <div class="app-sidebar-footer d-flex flex-column gap-1 mt-auto">
    <button
      type="button"
      class="sidebar-action btn btn-link d-flex align-items-center gap-3"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Use light theme' : 'Use dark theme'"
    >
      <i
        class="navigation-icon bi"
        [class.bi-sun]="themeService.theme() === 'dark'"
        [class.bi-moon-stars]="themeService.theme() !== 'dark'"
        aria-hidden="true"
      ></i>
      @if (!collapsed()) {
        <span>Theme</span>
      }
    </button>
    <button
      type="button"
      class="sidebar-action sidebar-action-muted btn btn-link d-flex align-items-center gap-3"
      (click)="logout.emit()"
    >
      <i class="navigation-icon bi bi-box-arrow-right" aria-hidden="true"></i>
      @if (!collapsed()) {
        <span>Sign out</span>
      }
    </button>
  </div>
</aside>
