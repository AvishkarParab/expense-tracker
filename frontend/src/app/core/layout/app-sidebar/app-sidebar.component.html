<aside class="app-sidebar p-3">
  <div class="app-sidebar-brand">
    @if (!collapsed()) {
      <img class="brand-mark" src="expense-tracker-logo.svg" alt="" />
      <span class="brand-text ms-2">Expense Tracker</span>
    }

    <button
      type="button"
      class="sidebar-toggle"
      [class.ms-auto]="!collapsed()"
      (click)="collapseSidebar.emit()"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!collapsed()"
    >
      @if (collapsed()) {
        <i class="bi bi-list"></i>
      } @else {
        <i class="bi bi-x-lg"></i>
      }
    </button>
  </div>

  <nav class="app-navigation" aria-label="Main navigation">
    <a class="app-navigation-link" routerLink="/dashboard" routerLinkActive="active">
      <i class="navigation-icon bi bi-speedometer2" aria-hidden="true"></i>
      @if (!collapsed()) {
        <span class="nav-text">Overview</span>
      }
    </a>
    <a class="app-navigation-link" routerLink="/expenses" routerLinkActive="active">
      <i class="navigation-icon bi bi-wallet2" aria-hidden="true"></i>
      @if (!collapsed()) {
        <span class="nav-text">Expenses</span>
      }
    </a>
  </nav>

  <div class="app-sidebar-footer mt-auto">
    <button
      type="button"
      class="sidebar-action"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Use light theme' : 'Use dark theme'"
    >
      <i
        class="navigation-icon bi"
        [class.bi-sun]="themeService.theme() === 'dark'"
        [class.bi-moon-stars]="themeService.theme() !== 'dark'"
        aria-hidden="true"
      ></i>
      @if (!collapsed()) {
        <span class="nav-text">Theme</span>
      }
    </button>

    <button type="button" class="sidebar-action sidebar-action-muted" (click)="logout.emit()">
      <i class="navigation-icon bi bi-box-arrow-right" aria-hidden="true"></i>
      @if (!collapsed()) {
        <span class="nav-text">Sign out</span>
      }
    </button>
  </div>
</aside>
