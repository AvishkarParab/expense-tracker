<div class="input-field" [class.floating]="floatingLabel()" [ngClass]="'size-' + size()">
  @if (label() && !floatingLabel()) {
    <label [for]="id()">{{ label() }}</label>
  }

  <div class="input-control">
    @if (iconClass(); as icon) {
      <span class="input-icon" [ngClass]="icon" aria-hidden="true"></span>
    }

    <select
      [id]="id()"
      [formField]="$any(field())"
      [attr.aria-label]="label() || name()"
      [attr.aria-invalid]="validationMessage ? 'true' : null"
      [attr.aria-describedby]="validationMessage ? id() + '-error' : null"
    >
      @if (placeholder()) {
        @if (bind() === 'value') {
          <option value="" disabled selected hidden>{{ placeholder() }}</option>
        } @else {
          <option [ngValue]="null" disabled selected hidden>{{ placeholder() }}</option>
        }
      }

      <!-- Loop through your ITextValue options -->
      @for (option of options(); track option.value) {
        @if (bind() === 'value') {
          <option [value]="option.value" [disabled]="option.additionalInfo?.disabled">
            {{ option.text }}
          </option>
        } @else {
          <option [ngValue]="option" [disabled]="option.additionalInfo?.disabled">
            {{ option.text }}
          </option>
        }
      }
    </select>

    @if (label() && floatingLabel()) {
      <label class="floating-label" [for]="id()">{{ label() }}</label>
    }
  </div>

  @if (validationMessage; as message) {
    <p class="validation-message" [id]="id() + '-error'">{{ message }}</p>
  }
</div>
